stages:
  - test
  - build
  - release

variables:
  FLUTTER_IMAGE: "mobiledevops/flutter-sdk-image:latest"

default:
  interruptible: true

.tag_rules:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never

# -----------------------------------------------------------------------------
# Stage 1: Test & Code Quality
# -----------------------------------------------------------------------------
lint_and_test:
  stage: test
  image: $FLUTTER_IMAGE
  before_script:
    - flutter doctor -v
    - flutter pub get
  script:
    - flutter analyze
    - flutter test --reporter=expanded
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# -----------------------------------------------------------------------------
# Stage 2: Cross-Platform Builds (Triggered on Tag push)
# -----------------------------------------------------------------------------
build:android:
  stage: build
  image: $FLUTTER_IMAGE
  extends: .tag_rules
  before_script:
    - flutter pub get
  script:
    - flutter build apk --release
    - mkdir -p artifacts
    - cp build/app/outputs/flutter-apk/app-release.apk artifacts/ttrpg_audio_player-android-$CI_COMMIT_TAG.apk
  artifacts:
    name: "android-$CI_COMMIT_TAG"
    paths:
      - artifacts/ttrpg_audio_player-android-$CI_COMMIT_TAG.apk
    expire_in: 30 days

build:linux:
  stage: build
  image: $FLUTTER_IMAGE
  extends: .tag_rules
  before_script:
    - sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libstdc++-12-dev
    - flutter pub get
  script:
    - flutter build linux --release
    - mkdir -p artifacts
    - tar -czvf artifacts/ttrpg_audio_player-linux-$CI_COMMIT_TAG.tar.gz -C build/linux/x64/release/bundle .
  artifacts:
    name: "linux-$CI_COMMIT_TAG"
    paths:
      - artifacts/ttrpg_audio_player-linux-$CI_COMMIT_TAG.tar.gz
    expire_in: 30 days

build:windows:
  stage: build
  image: mcr.microsoft.com/windows/servercore:ltsc2022
  extends: .tag_rules
  before_script:
    - flutter pub get
  script:
    - flutter build windows --release
    - powershell -Command "New-Item -ItemType Directory -Force -Path artifacts"
    - powershell -Command "Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath artifacts\ttrpg_audio_player-windows-$CI_COMMIT_TAG.zip"
  artifacts:
    name: "windows-$CI_COMMIT_TAG"
    paths:
      - artifacts/ttrpg_audio_player-windows-$CI_COMMIT_TAG.zip
    expire_in: 30 days

# -----------------------------------------------------------------------------
# Stage 3: GitLab Release Creation
# -----------------------------------------------------------------------------
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  extends: .tag_rules
  needs:
    - job: build:android
      artifacts: true
    - job: build:linux
      artifacts: true
    - job: build:windows
      artifacts: true
  script:
    - echo "Publishing release for tag $CI_COMMIT_TAG"
  release:
    name: "Release $CI_COMMIT_TAG"
    tag_name: '$CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG of TTRPG Audio Player'
    assets:
      links:
        - name: 'Android APK'
          url: '${CI_PROJECT_URL}/-/jobs/${BUILD_ANDROID_JOB_ID}/artifacts/raw/artifacts/ttrpg_audio_player-android-${CI_COMMIT_TAG}.apk'
        - name: 'Linux Archive (tar.gz)'
          url: '${CI_PROJECT_URL}/-/jobs/${BUILD_LINUX_JOB_ID}/artifacts/raw/artifacts/ttrpg_audio_player-linux-${CI_COMMIT_TAG}.tar.gz'
        - name: 'Windows Bundle (ZIP)'
          url: '${CI_PROJECT_URL}/-/jobs/${BUILD_WINDOWS_JOB_ID}/artifacts/raw/artifacts/ttrpg_audio_player-windows-${CI_COMMIT_TAG}.zip'
