name: Release

# A tag like v1.2.0 builds every platform and publishes a GitHub release with
# the build artifacts attached.
on:
  push:
    tags: ["v*"]

env:
  FLUTTER_VERSION: "3.47.7"

permissions:
  contents: write

jobs:
  linux:
    name: Linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libasound2-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Pack
        run: tar -C build/linux/x64/release/bundle -czf "DnDisc-${{ github.ref_name }}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: DnDisc-*-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Pack
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "DnDisc-${{ github.ref_name }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: DnDisc-*-windows-x64.zip
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Name
        run: cp build/app/outputs/flutter-apk/app-release.apk "DnDisc-${{ github.ref_name }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: DnDisc-*-android.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
